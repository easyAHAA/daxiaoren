name: DaSiuYan
options:
  bundleIdPrefix: com.dasiyan
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  DaSiuYan:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: App
      - path: Features
      - path: Services
      - path: Components
      - path: Models
      - path: Resources
        excludes:
          - "Info.plist"
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dasiyan.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""


  DaSiuYanTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests
    dependencies:
      - target: DaSiuYan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dasiyan.app.tests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
